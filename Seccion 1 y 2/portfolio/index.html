<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Etiquetas basicas HTML</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>Etiquetas basicas HTML</h1>
    <form action = "" method = "get">
        <label for = "nombre">Nombre:</label>
        <input type = "text" id = "nombre" name = "nombre">

        <select name = "country" id ="country">
            <option value = "spain">España</option>
            <option value = "france">Francia</option>
            <option value = "italy" selected>Italia</option>
        </select>

        <label for = ""> 
            <input type ="checkbox" name="skills" id="" value= "html" >
                HTML
        </label>


        <!-- en los radios si se puede tener el mismo name, pero el value tiene que 
         ser diferente para cada uno, para que se pueda seleccionar solo uno de ellos, 
         si tienen el mismo value no se va a poder seleccionar ninguno   -->
        <label for = ""> 
            <input type ="radio" name="dev" id="" value= "css" >
                CSS
        </label>
        <label for = ""> 
            <input type ="radio" name="dev" id="" value= "css" >
                javScript
        </label>
        

        <a href = "https://www.google.com" target = "_blank">Ir a Google</a>
        <a href = "#parrafo">Ir al parrafo</a>



        <button type = "submit">Enviar con button</button>
    </form>

    <p>lore ipsum dolor sit amet</p>
    <p>lore ipsum dolor sit amet</p>
    <p id="parrafo">lore ipsum dolor sit amet</p>
</body>
</html>
